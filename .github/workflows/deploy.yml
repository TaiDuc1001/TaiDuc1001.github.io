name: Deploy site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_LOCKFILE_CHECKSUMS: "false"
        with:
          ruby-version: ruby
          bundler-cache: false
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick biber

          pip3 install --upgrade jupyter
          sudo ./bin/install_tectonic.sh

          export JEKYLL_ENV=production
          export BUNDLE_LOCKFILE_CHECKSUMS=false
          export BUNDLE_FROZEN=false

          ruby -e "cfg=File.read('_config.yml'); cfg.sub!(/(giscus:\s*\n(?:[ \t].*\n)*?[ \t]*repo:\s*).*/, '\\1' + ENV.fetch('GITHUB_REPOSITORY')); File.write('_config.yml', cfg)"

          bundle config set path vendor/bundle
          bundle config set frozen false
          bundle install --jobs 4 --retry 3

          bundle exec ruby bin/build_bibliography.rb
          ruby bin/generate_repositories_page.rb
          ruby bin/fetch_github_metadata.rb
          ruby bin/generate_gallery_page.rb
          ruby bin/generate_people_page.rb
          ruby bin/generate_cv_latex.rb
          bundle exec jekyll build

          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
